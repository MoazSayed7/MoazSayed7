name: Profile metrics

# Renders the stats cards (including private repositories) as SVG files
# and commits them to this repository. The README shows those files, so
# no third-party server ever sees the token.

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the hour to avoid queue spikes
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN can only write repo contents.
permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Overview
        uses: lowlighter/metrics@v4
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update overview [skip ci]"
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@v4
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update languages [skip ci]"
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          # Generated Flutter platform code (desktop/iOS runners) skews the chart
          plugin_languages_ignored: c, c++, cmake, objective-c, swift, ruby

      - name: Lines of code
        uses: lowlighter/metrics@v4
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update lines [skip ci]"
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          plugin_lines: yes
